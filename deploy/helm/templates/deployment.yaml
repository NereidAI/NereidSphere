apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nereidsphere.fullname" . }}
  labels:
    {{- include "nereidsphere.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      {{- include "nereidsphere.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nereidsphere.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: sphere
      annotations:
        # Restart pods when generated configuration or the Valkey Secret reference changes.
        checksum/config: {{ include "nereidsphere.config" . | sha256sum }}
        checksum/valkey-secret: {{ default .Values.valkey.auth.password .Values.valkey.auth.existingSecret | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "nereidsphere.selectorLabels" . | nindent 18 }}
                  app.kubernetes.io/component: sphere
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "-c", "/app/config/config.yaml"]
{{- if .Values.valkey.enabled }}
          env:
            - name: NS_VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nereidsphere.valkeySecretName" . }}
                  key: password
{{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
{{- if .Values.config.oidc.caBundleSecret }}
            - name: oidc-ca
              mountPath: /etc/ssl/certs/nereid-oidc-ca.pem
              subPath: ca.crt
              readOnly: true
{{- end }}
      volumes:
        - name: config
          secret:
            secretName: {{ include "nereidsphere.configSecretName" . }}
{{- if .Values.config.oidc.caBundleSecret }}
        - name: oidc-ca
          secret:
            secretName: {{ .Values.config.oidc.caBundleSecret }}
{{- end }}
