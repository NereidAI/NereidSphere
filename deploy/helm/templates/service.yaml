apiVersion: v1
kind: Service
metadata:
  name: {{ include "nereidsphere.fullname" . }}
  labels:
    {{- include "nereidsphere.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "nereidsphere.selectorLabels" . | nindent 4 }}
