{{- if not .Values.config.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nereidsphere.fullname" . }}-config
  labels:
    {{- include "nereidsphere.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
{{ include "nereidsphere.config" . | indent 4 }}
{{- end }}
