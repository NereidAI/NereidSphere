{{- if and .Values.valkey.enabled (not .Values.valkey.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nereidsphere.valkeySecretName" . }}
  labels:
    {{- include "nereidsphere.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "valkey.auth.password is required" .Values.valkey.auth.password | quote }}
{{- end }}
