# Rolling dev channel. Every push to main publishes to GHCR via the
# organization reusable workflow: the image keeps its floating 0.0.0-dev tag
# alongside the per-commit traceability tag, while the development chart is
# published on the single floating 0.0.0-dev identity (no per-commit chart
# tag). Pull requests deliberately do not trigger this, so forks cannot
# publish into the organization namespace. Formal releases remain tag-only
# through release.yml.
name: Publish Dev Image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prep:
    name: Derive image build metadata
    runs-on: ubuntu-latest
    outputs:
      build_date: ${{ steps.meta.outputs.build_date }}
    steps:
      - id: meta
        run: echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  publish-dev-image:
    name: Build and publish dev image
    needs: prep
    uses: NereidAI/.github/.github/workflows/publish-dev-image.yml@v1
    with:
      image-name: nereidsphere
      file: build/Dockerfile
      build-args: |
        GIT_SHA=${{ github.sha }}
        BUILD_DATE=${{ needs.prep.outputs.build_date }}

  publish-dev-chart:
    name: Publish dev Helm charts
    needs: publish-dev-image
    uses: NereidAI/.github/.github/workflows/publish-chart.yml@v1
    with:
      chart-path: deploy/helm
      chart-name: nereidsphere
      channel: development
      set-values: valkey.auth.password=ci-render-only-placeholder
